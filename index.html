<script>
  // cor de fundo da cena do horário já no primeiro quadro, antes do React
  (function () {
    var q = parseFloat(new URLSearchParams(location.search).get('hora')), d = new Date();
    var h = isNaN(q) ? d.getHours() + d.getMinutes() / 60 : ((q % 24) + 24) % 24;
    var c = h < 5.25 || h >= 19.5 ? '#164C65' : h >= 7.25 && h < 17 ? '#95A8C2' : '#A07770';
    document.documentElement.style.background = c;
  })();
</script>
