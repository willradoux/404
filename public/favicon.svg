<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bear { fill: #0A0A0A; }
    @media (prefers-color-scheme: dark) { .bear { fill: #FFFFFF; } }
  </style>
  <defs>
    <!-- olhos, nariz e orelhas vazados: o urso funciona numa cor só -->
    <mask id="face">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="14" cy="16" r="3.8" fill="#000"/>
      <circle cx="50" cy="16" r="3.8" fill="#000"/>
      <circle cx="23" cy="34" r="3.2" fill="#000"/>
      <circle cx="41" cy="34" r="3.2" fill="#000"/>
      <ellipse cx="32" cy="44" rx="5.2" ry="3.8" fill="#000"/>
    </mask>
  </defs>
  <g class="bear" mask="url(#face)">
    <circle cx="14" cy="16" r="9"/>
    <circle cx="50" cy="16" r="9"/>
    <ellipse cx="32" cy="37" rx="25" ry="22"/>
  </g>
</svg>
